[project]
name = "sddctx"
version = "0.1.0"
description = "SDD context management for the MiniMax x OceanBase competition solution."
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
authors = [{ name = "MiniMax x OceanBase competition team" }]
keywords = ["sdd", "spec-driven-development", "powercontext", "oceanbase", "seekdb", "minimax"]
dependencies = [
    "httpx>=0.28,<1",
    # The HTTP client of PowerContext is the only part the context manager
    # needs at runtime; the server is pulled in through the "server" extra.
    "powercontext[client]>=1.4",
]

[project.optional-dependencies]
# Everything that is needed to run the PowerContext Server that backs the
# context store.  On the full repository this comes from the local source
# tree ("uv pip install -e ."), on the competition branch from PyPI.
# The "cli" extra carries typer, which the "powercontext" console script needs.
server = ["powercontext[server,cli]>=1.4"]
# The embedded seekdb binding, used by the Docker-free storage mode.
seekdb = ["pylibseekdb>=1.4.0.post1,<2"]
# The test runner of the sample project.
dev = ["pytest>=8,<10"]

[project.scripts]
sddctx = "sddctx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sddctx"]

[tool.hatch.build.targets.sdist]
include = ["sddctx", "sample", "scripts", "env", "README.md"]
